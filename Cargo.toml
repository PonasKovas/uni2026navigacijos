[package]
name = "software"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-stm32 = { version = "0.6.0", features = [
    "defmt",
    "stm32l432kc",
    "time-driver-any",
    "unstable-pac",
    "exti",
] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-executor = { version = "0.9.0", features = [
    "arch-cortex-m",
    "executor-thread",
    "defmt",
] }
embassy-time = { version = "0.5.0", features = [
    "defmt",
    "defmt-timestamp-uptime",
    "tick-hz-32_768",
] }
embassy-futures = { version = "0.1.2" }
defmt = "1.0.1"
defmt-rtt = "1.0.0"

cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

vl53l5cx-rs = { version = "0.1.0", path = "../../../vl53l5cx-rs/vl53l5cx-rs", default-features = false, features = [
    "defmt",
    "distance-mm",
    "target-status",
    "targets-4",
] }
zerocopy = { version = "0.8.63", features = ["derive"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = false
debug = true
